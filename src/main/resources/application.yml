server:
  port: 5000
  netty:
    connection-timeout: 5s
    idle-timeout: 60s
  compression:
    enabled: true

spring:
  application:
    name: similar-products
  jackson:
    default-property-inclusion: non_null

products:
  base-url: ${PRODUCTS_API_BASE_URL:http://localhost:3001}
  connect-timeout: 500ms
  similar-ids-timeout: 2s
  detail-timeout: 10s
  fan-out-budget: 2s
  fan-out-concurrency: 16
  max-connections: 1000
  pending-acquire-timeout: 2s
  max-retries: 1
  retry-backoff: 20ms
  cache:
    enabled: true
    similar-ids-ttl: 60s
    detail-ttl: 300s
    max-size: 50000

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 10
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.reactive.function.client.WebClientRequestException
          - org.springframework.web.reactive.function.client.WebClientResponseException
        ignore-exceptions:
          - com.inditex.similarproducts.domain.ProductNotFoundException
    instances:
      similarIds:
        base-config: default
      productDetail:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,caches
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.inditex.similarproducts: INFO
